# role: ethpandaops.general.bootstrap
ethlambda_extra_github_users: []  # handles not yet in the coredevs registry
bootstrap_default_user_authorized_keys_github_team_cl: >-
  {{ (query('ethpandaops.general.url_cached', coredevs_api_url ~ '/api/v1/users/ethlambda?format=txt', errors='ignore') | default([], true) | select | list)
     + ethlambda_extra_github_users }}

# role: validator_keys
validator_keys_sync_files:
  - src: "{{ inventory_dir }}/files/validator_keys/{{ inventory_hostname }}/keys/"
    dest: "{{ ethlambda_validator_datadir }}/keys/"
  - src: "{{ inventory_dir }}/files/validator_keys/{{ inventory_hostname }}/secrets/"
    dest: "{{ ethlambda_validator_datadir }}/secrets/"

validator_bls_sync_files:
  - src: "{{ inventory_dir }}/files/validator_keys/{{ inventory_hostname }}/change_operations.json"
    dest: "{{ ethlambda_validator_datadir }}/change_operations.json"
    owner: ethlambda
    group: ethlambda

# role: ethpandaops.general.ethereum_node
ethereum_node_cl: ethlambda

# role: ethpandaops.general.ethlambda
ethlambda_container_name: beacon
ethlambda_validator_container_name: validator
ethlambda_container_image: "{{ default_ethereum_client_images.ethlambda }}"
ethlambda_container_entrypoint:
  - ethlambda-pq
ethlambda_container_env:
  VIRTUAL_HOST: "{{ ethereum_node_beacon_hostname }}"
  VIRTUAL_PORT: "{{ ethereum_node_cl_ports_http_beacon | string }}"
  LETSENCRYPT_HOST: "{{ ethereum_node_beacon_hostname }}"
ethlambda_container_volumes:
  - "{{ ethlambda_datadir }}:/data"
  - "{{ ethlambda_auth_jwt_path }}:/execution-auth.jwt:ro"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
ethlambda_container_command_extra_args:
  - --network=/network-config
  - --bootnodes={{ ethereum_cl_bootnodes | join(',') }}
ethlambda_validator_container_volumes:
  - "{{ ethlambda_validator_datadir }}:/validator-data"
  - "{{ eth_testnet_config_dir }}:/network-config:ro"
  - "{{ pq_keys_host_dir }}:{{ pq_keys_container_dir }}:ro"
ethlambda_validator_container_command_extra_args:
  - --graffiti={{ inventory_hostname }}
  - --vrf-state-url={{ pq_vrf_state_path }}
  - --xmss-cache-url={{ pq_xmss_cache_path }}
ethlambda_validator_datadir: /data/ethlambda-validator
ethlambda_container_pull: true
